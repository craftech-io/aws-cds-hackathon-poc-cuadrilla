<body>
<nav id="nav"><h1>aws-cds-hackathon-poc-cuadrilla</h1></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.4/marked.min.js"

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.min.js"

<script>
const DOCS = [
  { group: "Project",   file: "../CLAUDE.md",  label: "CLAUDE.md" },
  { group: "Project",   file: "../CONTEXT.md", label: "CONTEXT.md" },
  { group: "Project",   file: "../README.md",  label: "README" },
  { group: "Design",    file: "design-brief.md",              label: "Design brief" },
  { group: "Design",    file: "architecture.md",              label: "Architecture" },
  { group: "Design",    file: "architecture-integrations.md", label: "Integrations" },
  { group: "Design",    file: "flows-catalog.md",             label: "Flows catalog" },
  { group: "Design",    file: "tool-catalog.md",              label: "Tool catalog" },
  { group: "Design",    file: "seed-spec.md",                 label: "Seed spec" },
  { group: "Design",    file: "test-plan.md",                 label: "Test plan" },
  { group: "Design",    file: "build-plan.md",                label: "Build plan" },
  { group: "Design",    file: "reuse-map.md",                 label: "Reuse map" },
  { group: "Design",    file: "pending.md",                   label: "Pendientes" },
  { group: "Decisions", file: "adr/0001-reuso-del-scaffolding-interno.md", label: "0001 · Reuso del scaffolding interno" },
  { group: "Decisions", file: "adr/0002-modos-de-canal-y-enrutamiento-por-numero.md", label: "0002 · Modos de canal y enrutamiento por numero" },
  { group: "Decisions", file: "adr/0003-sin-recepcion-de-email.md", label: "0003 · Sin recepcion de email" },
  { group: "Decisions", file: "adr/0004-esperas-de-la-escalera-con-temporizadores.md", label: "0004 · Esperas de la escalera con temporizadores" },
  { group: "Decisions", file: "adr/0005-manual-en-knowledge-base-sobre-s3-vectors.md", label: "0005 · Manual en knowledge base sobre s3 vectors" },
  { group: "Decisions", file: "adr/0006-fotos-y-voces-sinteticas.md", label: "0006 · Fotos y voces sinteticas" },
  { group: "Decisions", file: "adr/0007-ejecutor-de-escenarios-y-principal-de-qa.md", label: "0007 · Ejecutor de escenarios y principal de qa" },
  { group: "Decisions", file: "adr/0008-neutralidad-de-marca.md", label: "0008 · Neutralidad de marca" },
  { group: "Decisions", file: "adr/0009-rol-de-ci-por-bootstrap.md", label: "0009 · Rol de ci por bootstrap" },
  { group: "Decisions", file: "adr/0010-reloj-de-demo-por-mundo.md", label: "0010 · Reloj de demo por mundo" },
  { group: "Decisions", file: "adr/0011-la-validacion-manual-es-humana.md", label: "0011 · La validacion manual es humana" },
  { group: "Decisions", file: "adr/0012-politica-de-contacto-en-codigo.md", label: "0012 · Politica de contacto en codigo" },
  { group: "Decisions", file: "adr/0013-idiomas.md", label: "0013 · Idiomas" },
  { group: "Decisions", file: "adr/0014-el-agente-habla-solo-por-tools.md", label: "0014 · El agente habla solo por tools" },
  { group: "Decisions", file: "adr/0015-la-imagen-nunca-llega-al-harness.md", label: "0015 · La imagen nunca llega al harness" },
  { group: "Decisions", file: "adr/0016-seguridad-determinista.md", label: "0016 · Seguridad determinista" },

  { group: "Decisions", file: "adr/0018-co-branding-configurable.md", label: "0018 · Co branding configurable" },
  { group: "Decisions", file: "adr/0019-techo-de-costo-y-corte-en-runtime.md", label: "0019 · Techo de costo y corte en runtime" },
  { group: "Decisions", file: "adr/0020-modelo-del-harness-y-presupuesto-de-latencia.md", label: "0020 · Modelo del harness y presupuesto de latencia" },
  { group: "Decisions", file: "adr/0021-partes-de-paso-y-claves-de-oraculo.md", label: "0021 · Partes de paso y claves de oraculo" },
  { group: "Agents",    file: "../.claude/agents/pm.md", label: "pm" },
  { group: "Agents",    file: "../.claude/agents/architect.md", label: "architect" },
  { group: "Agents",    file: "../.claude/agents/devops.md", label: "devops" },
  { group: "Agents",    file: "../.claude/agents/typescript-dev.md", label: "typescript-dev" },
  { group: "Agents",    file: "../.claude/agents/qa.md", label: "qa" },
  { group: "Agents",    file: "../.claude/agents/security.md", label: "security" },
  { group: "Agents",    file: "../.claude/agents/seed-generator.md", label: "seed-generator" }
];

const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: isDark ? "dark" : "neutral", securityLevel: "strict" });

const nav = document.getElementById("nav");
const content = document.getElementById("content");
let seen = null;
for (const d of DOCS) {
  if (d.group !== seen) { const h = document.createElement("h2"); h.textContent = d.group; nav.appendChild(h); seen = d.group; }
  const a = document.createElement("a");
  a.textContent = d.label; a.href = "#" + d.file; a.dataset.file = d.file;
  a.onclick = e => { e.preventDefault(); location.hash = d.file; };
  nav.appendChild(a);
}

async function load(file) {
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.file === file));
  try {
    const res = await fetch(file + "?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const md = await res.text();
    // strip YAML frontmatter so agent files render cleanly
    const body = md.replace(/^---\n[\s\S]*?\n---\n/, "");
    content.innerHTML = marked.parse(body);
    // turn fenced mermaid blocks into diagrams
    const blocks = content.querySelectorAll("pre code.language-mermaid, code.language-mermaid");
    let i = 0;
    for (const block of blocks) {
      const src = block.textContent;
      const holder = document.createElement("div");
      holder.className = "mermaid";
      (block.closest("pre") || block).replaceWith(holder);
      try {
        const { svg } = await mermaid.render("d" + (i++) + "_" + Date.now(), src);
        holder.innerHTML = svg;
      } catch (err) {
        holder.innerHTML = '<p class="err">Mermaid error: ' + err.message + "</p>";
      }
    }
    content.parentElement.scrollTop = 0;
  } catch (err) {
    content.innerHTML = '<p class="err">Could not load ' + file + ": " + err.message + "</p>";
  }
}

// The hash may only name a file this page lists. Without this the viewer fetches whatever a
// link puts in the fragment, and the server's root is the engagement folder.
const route = () => {
  const asked = location.hash ? decodeURIComponent(location.hash.slice(1)) : "design-brief.md";
  const known = DOCS.some(d => d.file === asked);
  load(known ? asked : "design-brief.md");
};
window.addEventListener("hashchange", route);
route();
</script>
</body>
