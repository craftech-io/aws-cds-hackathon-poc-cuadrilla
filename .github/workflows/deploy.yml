# Deploys stage `poc` on every push to main. This is the only place `sst deploy` ever runs.
#
# Credentials come from GitHub's OIDC token exchanged for the deploy role created once by
# infra/bootstrap/ci-role.yaml; the smoke assumes the qa-runner role of the same template. No access
# keys exist for this app. Secrets (`sst.Secret`) must already be loaded for `poc` by the operator
# (docs/architecture.md §15 step 3): a secret without a value stops the deploy.
#
# Both roles trust the `sub` of a push to main plus the numeric repository and owner ids and the
# `job_workflow_ref` of this file. That is why the jobs declare NO `environment:`: with one, GitHub
# emits `sub = repo:<org>/<repo>:environment:<name>` and AssumeRoleWithWebIdentity fails. The fix is
# never a wildcard in the trust policy.
#
# Order (docs/architecture.md §15 step 5): the checks of ci.yml (the forbidden terms and the neutral
# public surfaces of ADR-0023 included, on the sources and on the web build), then assume the deploy
# role, prove who we are, deploy, load the seed (idempotent: uploads the manual and ingests the
# Knowledge Base only when its fingerprint changed), read the Bff's Function URL from this app's SST
# state, then assume qa-runner and run the smoke suite: SC-00 through the QA driver (docs/test-plan.md
# §6), with SMK/9 (the edge's AWS WAF challenge to a sign-up without a token, also in a batch) and
# SMK/10 (the Function URL called directly answers 403) sent from this runner. A first deploy's DKIM
# still PENDING makes SMK/6 a warning; any other failure turns the run red. The smoke spends a single
# agent turn and a single photo validation; the full suite and the measurements never run here
# (scenarios.yml, by hand, with the CTO's OK). The smoke report (ids, codes and counts; no PII) goes to
# the run summary and is kept as an artifact, pass or fail. This app never receives email, so there is
# no SES receipt rule set to check (ADR-0003). Steps whose script is not in the repository yet print a
# notice and pass (never the forbidden terms, never the smoke).

name: Deploy poc

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

# One deploy at a time; a queued run waits instead of racing the previous one for the SST lock.
concurrency:
  group: deploy-poc
  cancel-in-progress: false

env:
  CI: "true"
  SST_TELEMETRY_DISABLED: "1"
  AWS_REGION: us-east-1
  APP_URL: https://cuadrilla.demo.craftech.io
  SMOKE_REPORT_DIR: test-results/smoke

jobs:
  deploy:
    name: Checks, then sst deploy --stage poc
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (full history, the commit messages are checked too)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: "Guard: no local-only files are committed"
        run: |
          offenders="$(git ls-files | grep -E '\.local\.[^/]+$' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::Local-only files are committed (see .gitignore):"
            echo "$offenders"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint, duplicates, typecheck and tests
        run: |
          npm run lint
          npm run lint:duplicates
          npm run typecheck
          npm test

      - name: Seed, manual, flows, tour, ownership, tool schemas, channel modes and network contract
        # seed:validate's invariant 11 runs the forbidden-terms list over the seed and fails closed without it.
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          run_if() { if [ -f "$1" ]; then npm run "$2"; else echo "::notice::$2 skipped: $1 is not in the repository yet."; fi; }
          run_if scripts/seed/validate.ts seed:validate
          run_if scripts/manual/check.ts manual:check
          npm run flows:check
          run_if scripts/tour/check.ts tour:check
          npm run lint:wp-ownership
          run_if packages/bff/src/agent-tools/common/build-schemas.ts tools:build-schemas
          npm run channels:check-modes
          run_if scripts/network/contract-check.ts network:contract

      - name: Forbidden terms (tree, commit messages, PDFs, photo texts, manual and seed)
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: npm run lint:forbidden

      - name: Neutral public surfaces (visible sources, rendered auth emails, PDFs and product README)
        run: npm run lint:neutral-surfaces

      - name: Build the console
        run: npm run build -w packages/web

      - name: Forbidden terms in the web build
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: npm run lint:forbidden -- --dist

      - name: Neutral public surfaces in the web build (before any AWS credential)
        run: npm run lint:neutral-surfaces -- --dist

      - name: Assume the deploy role (OIDC, no access keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::776805327629:role/aws-cds-hackathon-poc-cuadrilla-github-deploy' }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: us-east-1

      - name: Who am I (proves the role was assumed without access keys)
        run: aws sts get-caller-identity

      # A deploy that changes the agent's model can fail once on the AgentCore Memory update while IAM
      # propagates the new grants; the same deploy run again succeeds. One retry after a minute, never more.
      - name: Deploy stage poc
        id: sst
        run: |
          if npx sst deploy --stage poc; then exit 0; fi
          echo "::warning::sst deploy failed; retrying once in 60 s (IAM propagation after a model or grant change)."
          sleep 60
          npx sst deploy --stage poc

      - name: Publish the deployed URL in the run summary
        run: |
          {
            echo "### Stage \`poc\` deployed"
            echo ""
            echo "- Console: ${APP_URL}"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Load the synthetic seed and the manual into poc (idempotent, ingests the Knowledge Base on change)
        run: npm run seed:load

      - name: The Bff's Function URL for SMK/10 (this app's SST state, masked)
        run: npx tsx scripts/qa/bff-url.ts

      # scenarios.yml cannot read the SST state (qa-runner has no access to it), so SC-00 of the full suite
      # takes the URL from the BFF_FUNCTION_URL repository secret. Compared here, never printed.
      - name: The Bff URL kept for scenarios.yml is current
        env:
          KEPT_BFF_URL: ${{ secrets.BFF_FUNCTION_URL }}
        run: |
          if [ -z "${KEPT_BFF_URL}" ]; then
            echo "::warning::The BFF_FUNCTION_URL secret is not set: SMK/10 of the full suite (scenarios.yml) will be BLOCKED."
          elif [ "${KEPT_BFF_URL%/}" != "${BFF_URL%/}" ]; then
            echo "::warning::The BFF_FUNCTION_URL secret differs from the deployed Bff's Function URL: update it before the next full suite."
          else
            echo "BFF_FUNCTION_URL matches the deployed Bff."
          fi

      - name: Assume the qa-runner role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_QA_RUNNER_ROLE_ARN || 'arn:aws:iam::776805327629:role/aws-cds-hackathon-poc-cuadrilla-qa-runner' }}
          role-session-name: github-qa-${{ github.run_id }}
          aws-region: us-east-1

      - name: Who am I (the smoke runs as qa-runner, never as the deploy role)
        run: aws sts get-caller-identity --query Arn --output text | grep -q -- '-qa-runner/' || { echo "::error::the smoke is not running as qa-runner"; exit 1; }

      - name: Smoke scenarios (SC-00, SMK/9 and SMK/10 from this runner)
        run: npm run scenarios -- --suite smoke --base-url "${APP_URL}" --bff-url "${BFF_URL}" --report-dir "${SMOKE_REPORT_DIR}"

      - name: Smoke report in the run summary
        if: ${{ !cancelled() && steps.sst.outcome == 'success' }}
        run: |
          report="${SMOKE_REPORT_DIR}/scenario-report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; else echo "::warning::The smoke wrote no report."; fi

      - name: Keep the smoke report
        if: ${{ !cancelled() && steps.sst.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SMOKE_REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 30
