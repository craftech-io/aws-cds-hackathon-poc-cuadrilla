# Scenario suite against the deployed stage `poc` (docs/test-plan.md §4), on demand. The runner
# drives every flow through the QA driver Lambda with the qa-runner role of the bootstrap
# (ADR-0007); no human credentials and no password in any secret. The one exception is SC-20 (suite
# `full`): it starts its sign-ups through the public path like a visitor, from a headless Chromium on
# `/signup` that solves the edge's AWS WAF challenge (scripts/scenarios/lib/public-signup.ts), so the
# job installs Playwright's Chromium on this runner first. Its starts spend this runner's per-IP room of
# the clock hour: dispatch the full suite at most once per hour. Only `main` can assume the role, so
# dispatch it from main. `eval` runs the agent evaluation set (EV-01 questions, EV-02 photos).
name: Scenarios poc

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run (full, eval or smoke)
        type: choice
        options:
          - full
          - eval
          - smoke
        default: full

permissions:
  id-token: write
  contents: read

concurrency:
  group: scenarios-poc
  cancel-in-progress: false

env:
  CI: "true"
  AWS_REGION: us-east-1

jobs:
  scenarios:
    name: Scenario suite
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Chromium for SC-20's public sign-up (this runner only)
        if: inputs.suite == 'full'
        run: npx playwright install --with-deps chromium

      - name: Assume the qa-runner role (OIDC, no access keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_QA_RUNNER_ROLE_ARN || 'arn:aws:iam::776805327629:role/aws-cds-hackathon-poc-cuadrilla-qa-runner' }}
          role-session-name: github-scenarios-${{ github.run_id }}
          aws-region: us-east-1

      - name: Run the suite
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          if [ ! -f scripts/scenarios/run.ts ]; then
            echo "::notice::scenarios skipped: scripts/scenarios/run.ts is not in the repository yet (WP-45)."
            exit 0
          fi
          npm run scenarios -- --suite "${SUITE}"
